name: Release

on:
  push:
    branches:
      - master
      - beta

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release needs the full history: it analyses every commit
          # since the last tag and pushes a refs/notes/semantic-release-<version>
          # ref, which GitHub rejects when the clone is shallow (the checkout
          # default fetch-depth is 1).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      # Published (production) dependencies must stay clean. The remaining
      # moderate advisories are dev-only and live inside the npm CLI that
      # @semantic-release/npm vendors (advisories in npm's bundled tree), so they
      # can only be cleared upstream -- tooling is therefore gated at high.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Release
        env:
          # The job's `permissions` above already grant this token everything
          # semantic-release needs (tags, releases, PR/issue comments).
          # Use a PAT secret instead only if releases must trigger other
          # workflows (GITHUB_TOKEN-initiated events do not).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A *granular* npm access token with "Read and write" permission for
          # et-calendar (plus "Bypass 2FA" if the account uses auth-and-writes).
          # A read-only token authenticates (npm whoami succeeds) but publishing
          # fails with E403. Granular tokens expire, so rotate before the expiry
          # date -- or replace this with npm trusted publishing (OIDC), which
          # needs no secret at all.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run semantic-release
